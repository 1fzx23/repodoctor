[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repodoctor"
version = "1.0.0"
description = "🩺 RepoDoctor — Git 仓库健康诊断工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "1fzx23" }
]
keywords = ["git", "cli", "repository", "health", "diagnostics", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

[project.scripts]
repodoctor = "repodoctor.cli:run_cli"

[project.urls]
Homepage = "https://github.com/1fzx23/repodoctor"
Repository = "https://github.com/1fzx23/repodoctor"
Issues = "https://github.com/1fzx23/repodoctor/issues"
